[project]
name = "b3code"
version = "0.1.0"
description = "Minimal coding TUI — Textual + Pydantic AI + Azure"
readme = "README.md"
authors = [
    { name = "NICOLAS-MAC", email = "nicolas.mmb@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pathspec>=1.1.1",
    "pydantic>=2.10",
    "pydantic-ai-harness[codemode]>=0.18.1",
    "pydantic-ai-slim[openai]>=2.28.0",
    "rapidfuzz>=3.14.5",
    "textual>=1.0",
]

[project.scripts]
b3code = "b3code.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
