[project]
name = "b3code"
version = "1.0.0"
description = "Minimal coding TUI — Textual + Pydantic AI + Azure"
readme = "README.md"
authors = [
    { name = "NICOLAS-MAC", email = "nicolas.mmb@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pathspec>=1.1.1",
    "pydantic>=2.10",
    "pydantic-ai-harness[codemode]>=0.18.1",
    "pydantic-ai-slim[duckduckgo,mcp,openai]>=2.28.0",
    "rapidfuzz>=3.14.5",
    "textual>=1.0",
]

[project.scripts]
b3code = "b3code.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "C90", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["b3code"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806", "B017"]
"src/b3code/utils/diffview.py" = ["C901"]
"src/b3code/utils/paths.py" = ["C901"]
"src/b3code/tools/workspace.py" = ["C901"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.13",
]
